<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ keyword if keyword else keyworld }} 잡서치결과 페이지입니다</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            padding: 40px 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.5px;
        }
        h1 .keyword {
            color: #1E5AE6; /* 인크루트 시그니처 블루 */
        }
        .btn-home {
            display: inline-block;
            text-decoration: none;
            background-color: #ffffff;
            color: #475569;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
        }
        .btn-home:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #94a3b8;
        }
        .table-wrap {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        thead {
            background-color: #1E5AE6;
            color: #ffffff;
        }
        th {
            padding: 16px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        th:first-child {
            text-align: center;
            width: 70px;
        }
        th:last-child {
            text-align: center;
            width: 120px;
        }
        tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.15s ease;
        }
        tbody tr:last-child {
            border-bottom: none;
        }
        tbody tr:hover {
            background-color: #f8fafc;
        }
        td {
            padding: 16px 20px;
            font-size: 0.95rem;
            vertical-align: middle;
        }
        td:first-child {
            text-align: center;
            font-weight: 700;
            color: #94a3b8;
        }
        td:nth-child(2) {
            font-weight: 700;
            color: #1e293b;
            width: 220px;
            word-break: keep-all;
        }
        td:nth-child(3) {
            color: #0f172a;
            font-weight: 600;
        }
        td:nth-child(4) {
            color: #64748b;
            width: 180px;
        }
        td:last-child {
            text-align: center;
        }
        .btn-detail {
            display: inline-block;
            background-color: #EEF4FF;
            color: #1E5AE6;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #DBEAFE;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-detail:hover {
            background-color: #1E5AE6;
            color: #ffffff;
            border-color: #1E5AE6;
        }
        .footer-info {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-area">
            <h1><span class="keyword">‘{{ keyword if keyword else keyworld }}’</span> 잡서치결과 페이지입니다</h1>
            <a href="/" class="btn-home">← 처음으로</a>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>순번</th>
                        <th>회사명</th>
                        <th>공고</th>
                        <th>회사위치</th>
                        <th>상세보기</th>
                    </tr>
                </thead>
                <tbody>
                    {% for index, job in jobs %}
                    <tr>
                        <td>{{ index + 1 }}</td>
                        <td>{{ job["company"] }}</td>
                        <td>{{ job["title"] }}</td>
                        <td>{{ job["location"] }}</td>
                        <td>
                            <a href="{{ job['link'] }}" target="_blank" class="btn-detail">상세보기</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="footer-info">
            데이터 출처: 인크루트(Incruit) 채용검색
        </div>
    </div>
</body>
</html>
