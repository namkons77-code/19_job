<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕하세요, 잡스크래퍼입니다.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .search-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            padding: 48px 40px;
            max-width: 580px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }
        h1 .highlight {
            color: #1E5AE6; /* 인크루트 시그니처 블루 */
        }
        form {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 1.05rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
            color: #1e293b;
        }
        input[type="text"]::placeholder {
            color: #94a3b8;
        }
        input[type="text"]:focus {
            border-color: #1E5AE6;
            box-shadow: 0 0 0 3px rgba(30, 90, 230, 0.15);
        }
        button {
            padding: 14px 26px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            background-color: #1E5AE6;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        button:hover {
            background-color: #1646b8;
        }
        button:active {
            transform: scale(0.98);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="search-card">
        <h1>안녕하세요, <span class="highlight">잡스크래퍼</span>입니다.</h1>
        <form action="search">
            <input type="text" name="keyword" placeholder="검색할 키워드를 입력하세요 (예: 파이썬)" required />
            <button>검색하기</button>
        </form>
        <div class="footer-note">인크루트(Incruit) 채용 정보를 실시간으로 검색합니다.</div>
    </div>
</body>
</html>
